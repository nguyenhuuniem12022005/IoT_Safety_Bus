<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Be Vietnam Pro",sans-serif;background:#F8FAFC;color:#0F172A;display:flex}
nav{width:232px;background:#0F172A;color:#E2E8F0;padding:24px 18px}
nav b{font-size:18px}
nav div{margin-top:22px;font-size:14px;opacity:.8}
main{flex:1;padding:28px}
h1{font-size:26px;font-weight:700}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:22px 0}
.c{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:18px}
.c span{font-size:13px;color:#64748B}
.c b{display:block;font-size:34px;margin-top:6px}
.red b{color:#DC2626}
.two{display:grid;grid-template-columns:1fr 380px;gap:16px}
.cam{background:#0F172A;height:460px;border-radius:10px}
.log{background:#fff;border:1px solid #E2E8F0;border-radius:10px;padding:18px}
.log div{padding:10px 0;border-top:1px solid #F1F5F9;font-size:14px}
</style></head><body>
<nav><b>Smart Bus</b><div>Tổng quan</div><div>Camera</div><div>Sự kiện</div><div>Lệnh</div></nav>
<main><h1>Tổng quan BUS-01</h1>
<div class="cards"><div class="c"><span>Sĩ số</span><b>1</b></div><div class="c red"><span>Trạng thái</span><b>WARNING</b></div><div class="c"><span>Camera YOLO</span><b>1 người</b></div><div class="c"><span>Quạt</span><b>ON</b></div></div>
<div class="two"><div class="cam"></div><div class="log"><b>Sự kiện</b><div>14:21 Cảnh báo còn người</div><div>14:20 Bắt đầu kiểm tra</div><div>14:19 Tắt khóa điện</div></div></div></main>
</body></html>
